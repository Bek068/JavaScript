<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Background Color Switch</title>
</head>
<body>
    <nav>
        <button aria-current="page" type="button" onclick="window.location.href='/home'">Home</button>
        <button aria-current="page" type="button" onClick="window.location.href='/about'">About</button>
    
        
    </nav>
    <div class="canvas">
        <h1>Background Color Switch</h1>
        <span class ="button" id = "yellow"></span>
        <span class ="button" id = "grey"></span>
        <span class ="button" id = "aqua"></span>
        <span class ="button" id = "blue"></span>
        <span class ="button" id = "silver"></span>
        <span class ="button" id = "white"></span>
    </div>
    <h2>
        Click on any one of the buttons to change the background color of the page or click on the "Home" link to go back to the Home page

    </h2>
    <script src="bgscript.js"></script>
</body>
</html>
